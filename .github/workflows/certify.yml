name: certify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: certify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ca-certificates git make perl python3 sbcl
      - name: Record SBCL cache identity
        id: sbcl
        run: echo "identity=$(sbcl --version | tr ' /' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .deps
          key: acl2-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ hashFiles('ACL2_VERSION') }}-${{ steps.sbcl.outputs.identity }}-${{ hashFiles('Makefile', 'scripts/install-acl2.sh', 'scripts/certify-system-deps.sh') }}
      - run: make setup
      - run: make check-policy
      - run: make certify
      - run: make test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acl2-certification-logs
          path: .deps/logs
          if-no-files-found: warn

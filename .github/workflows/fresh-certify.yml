name: fresh-certify
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fresh-certify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acl2-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ca-certificates git make perl python3 sbcl
      # Deliberately no cache restore: this job validates ACL2 construction and
      # the required Community Book dependency chain from the pinned sources.
      - run: make setup
      - run: make check-policy
      - run: make certify
      - run: make test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acl2-fresh-certification-logs
          path: .deps/logs
          if-no-files-found: warn
